  <title>Zarif Fida Chowdhury</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f1f2f0;
      --ink: #191b1f;
      --ox: #7a1f2b;
      --ox-2: #5f1721;
    }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body {
      font: 17px/1.6 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: clamp(20px, 5vw, 56px);
    }
    a {
      color: var(--ox);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: .18em;
    }
    a:hover { color: var(--ox-2); text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--ox); outline-offset: 3px; }
  </style>
</head>
